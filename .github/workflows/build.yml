name: build-windows

# The maintainer agent cannot see the user's machine, so CI is its
# eyes: every push builds the exe on a real Windows runner, launches
# it, captures QA screenshots to the `ci-qa` branch, and (on version
# tags) publishes a GitHub Release with the exe attached.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Offline backend, source, language and lifecycle regressions
        run: |
          $tests = @(
            'scripts/test_app_backend.py', 'scripts/test_paper_reader.py',
            'scripts/test_paper_html.py', 'scripts/test_saved_html.py',
            'scripts/test_fulltext.py', 'scripts/test_generation_language.py',
            'scripts/test_paper_trash.py', 'scripts/test_windows_recycle.py'
          )
          foreach ($test in $tests) {
            python -B $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build single-file exe
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --onefile
          --name LazyScholar --icon lazyscholar.ico
          --collect-all webview --collect-all pystray
          --collect-all pdfplumber --collect-all pdfminer --collect-all pypdfium2
          --collect-all bleach --collect-all bs4 --collect-all defusedxml
          --copy-metadata pywin32
          --add-data "vendor;vendor" --add-data "lazyscholar.ico;."
          lazyscholar.py

      - name: Smoke test + QA screenshots
        id: smoke
        continue-on-error: true
        run: python scripts/ci_smoke.py

      - name: Upload exe + QA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LazyScholar-windows
          path: |
            dist/LazyScholar.exe
            qa/

      - name: Publish QA screenshots to ci-qa branch
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path qa)) { Write-Host 'no qa folder'; exit 0 }
          $tmp = Join-Path $env:RUNNER_TEMP 'qa-publish'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Copy-Item qa/* $tmp -Recurse -Force
          Set-Location $tmp
          git init -b ci-qa .
          git config user.email 'ci@lazyscholar.local'
          git config user.name 'LazyScholar CI'
          git add -A
          git commit -m 'QA screenshots from CI run'
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-qa

      - name: Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LazyScholar.exe
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Preserve a manually uploaded and verified EXE instead of replacing it with a CI rebuild.
          overwrite_files: false
